<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc">
  <title id="title">Dzignex creative portfolio</title>
  <desc id="desc">A dark macOS-inspired portfolio window presenting Dzignex, its creative practice, and selected work.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0c0d"/>
      <stop offset="0.55" stop-color="#151416"/>
      <stop offset="1" stop-color="#090909"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#222124"/>
      <stop offset="1" stop-color="#151517"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5f57"/>
      <stop offset="0.5" stop-color="#ffbd2e"/>
      <stop offset="1" stop-color="#28c840"/>
    </linearGradient>
    <radialGradient id="glow" cx="74%" cy="52%" r="55%">
      <stop offset="0" stop-color="#ff6a3d" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ff6a3d" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1440" height="640" fill="url(#background)"/>
